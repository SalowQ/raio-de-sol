<h2 mat-dialog-title>Excluir registro</h2>
<mat-dialog-content>
  <p>O registro de {{ dados.dia }} será excluído.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Cancelar</button>
  <button mat-flat-button color="warn" type="button" [mat-dialog-close]="true">Excluir</button>
</mat-dialog-actions>
