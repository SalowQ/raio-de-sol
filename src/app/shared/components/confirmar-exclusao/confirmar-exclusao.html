<h2 mat-dialog-title>{{ dados.titulo }}</h2>
<mat-dialog-content>
  <p>{{ dados.mensagem }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Cancelar</button>
  <button mat-flat-button class="sol-perigo" type="button" [mat-dialog-close]="true">{{ rotulo() }}</button>
</mat-dialog-actions>
